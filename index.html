<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión de Exámenes</title>
<style>
:root{--azul:#07549a;--azul2:#0b6bd3;--fondo:#f3f7fb;--verde:#148447;--rojo:#c62828;--texto:#17212b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--fondo);color:var(--texto)}
header{background:linear-gradient(135deg,#073d70,#0870c9);color:white;padding:24px 18px}
header h1{margin:0;font-size:28px} header p{margin:6px 0 0;opacity:.9}
main{max-width:980px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 22px #16324f18}
h2{margin-top:0;color:#064b88}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:700;margin:8px 0 5px}input,select{width:100%;padding:12px;border:1px solid #c9d5e2;border-radius:10px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--azul2);color:white}.success{background:var(--verde);color:white}.ghost{background:#e9f2fb;color:#064b88}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}.blockcheck{background:#f5f8fb;border-radius:10px;padding:10px}
.blockcheck input{width:auto}.keyblock{margin-top:15px;border-top:1px solid #e4ebf2;padding-top:12px}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:7px}.q{display:flex;align-items:center;gap:6px;background:#f6f8fa;padding:7px;border-radius:9px}.q b{min-width:24px}.q select{padding:7px}
.result{font-size:44px;font-weight:900;color:var(--verde);text-align:center}.muted{color:#657383;text-align:center}.bad{color:var(--rojo)}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e5ebf1;text-align:left}th{background:#eef5fb}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.navbtn.active{background:var(--azul);color:#fff}
.notice{padding:11px;background:#fff7d6;border-radius:10px;margin-top:10px}
footer{text-align:center;color:#667;padding:20px}
</style>
</head>
<body>
<header><h1>📘 Revisión de Exámenes</h1><p>Telesecundaria 1117 · Mtro. Noé Fabián Pineda Mendoza</p></header>
<main>
<nav>
<button class="navbtn active" onclick="show('crear',this)">➕ Crear examen</button>
<button class="navbtn ghost" onclick="show('revisar',this)">✅ Revisar</button>
<button class="navbtn ghost" onclick="show('resultados',this)">📊 Resultados</button>
</nav>

<section id="crear" class="card">
<h2>Crear examen</h2>
<div class="grid">
<div><label>Nombre del examen</label><input id="examName" placeholder="Ej. Primer parcial"></div>
<div><label>Grupo</label><input id="examGroup" placeholder="Ej. 2° B"></div>
</div>
<label>Campos formativos a evaluar</label>
<div class="blocks">
<label class="blockcheck"><input type="checkbox" class="blk" value="Lenguajes" checked> Lenguajes</label>
<label class="blockcheck"><input type="checkbox" class="blk" value="Saberes y Pensamiento Científico"> Saberes y Pensamiento Científico</label>
<label class="blockcheck"><input type="checkbox" class="blk" value="De lo Humano y lo Comunitario"> De lo Humano y lo Comunitario</label>
<label class="blockcheck"><input type="checkbox" class="blk" value="Ética, Naturaleza y Sociedades"> Ética, Naturaleza y Sociedades</label>
</div>
<label>Reactivos por bloque</label><select id="numQ"><option>10</option><option selected>20</option></select>
<div class="actions"><button class="primary" onclick="buildKey()">Capturar clave</button></div>
<div id="keyArea"></div>
<div class="actions"><button class="success" onclick="saveExam()">💾 Guardar examen</button></div>
<div class="notice">Esta primera versión guarda los exámenes y resultados en este dispositivo. Después conectaremos la cámara, QR y la hoja en la nube.</div>
</section>

<section id="revisar" class="card hidden">
<h2>Revisar examen</h2>
<div class="grid">
<div><label>Examen</label><select id="examSelect" onchange="loadReview()"></select></div>
<div><label>Nombre del alumno</label><input id="studentName" placeholder="Nombre completo"></div>
</div>
<div id="reviewArea"></div>
<div class="actions"><button class="success" onclick="grade()">Calificar examen</button></div>
<div id="gradeArea"></div>
</section>

<section id="resultados" class="card hidden">
<h2>Resultados guardados</h2>
<div id="resultsArea"></div>
<div class="actions"><button class="ghost" onclick="exportCSV()">⬇️ Exportar CSV (Excel)</button></div>
</section>
</main>
<footer>Versión 1 · Revisión de Exámenes</footer>

<script>
const BLOCKS=["Lenguajes","Saberes y Pensamiento Científico","De lo Humano y lo Comunitario","Ética, Naturaleza y Sociedades"];
let exams=JSON.parse(localStorage.getItem("examsV1")||"[]");
let results=JSON.parse(localStorage.getItem("resultsV1")||"[]");

function show(id,btn){
 document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll(".navbtn").forEach(x=>{x.classList.remove("active");x.classList.add("ghost")});
 btn.classList.add("active");btn.classList.remove("ghost");
 if(id==="revisar") refreshExams();
 if(id==="resultados") renderResults();
}
function selectedBlocks(){return [...document.querySelectorAll(".blk:checked")].map(x=>x.value)}
function buildKey(){
 const n=+document.getElementById("numQ").value, blocks=selectedBlocks();
 if(!blocks.length)return alert("Selecciona al menos un campo formativo.");
 let h="";
 blocks.forEach((b,bi)=>{
  h+=`<div class="keyblock"><h3>${b}</h3><div class="answers">`;
  for(let i=1;i<=n;i++)h+=`<div class="q"><b>${i}</b><select class="key" data-block="${b}" data-q="${i}"><option value="">—</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>`;
  h+="</div></div>";
 });
 document.getElementById("keyArea").innerHTML=h;
}
function saveExam(){
 const name=document.getElementById("examName").value.trim(), group=document.getElementById("examGroup").value.trim();
 const n=+document.getElementById("numQ").value, blocks=selectedBlocks(), keys={};
 if(!name)return alert("Escribe el nombre del examen.");
 if(!document.querySelector(".key"))return alert("Primero pulsa Capturar clave.");
 for(const b of blocks){
  keys[b]=[];
  for(let i=1;i<=n;i++){
   const el=document.querySelector(`.key[data-block="${CSS.escape(b)}"][data-q="${i}"]`);
   if(!el||!el.value)return alert(`Falta la respuesta ${i} de ${b}.`);
   keys[b].push(el.value);
  }
 }
 exams.push({id:Date.now(),name,group,n,blocks,keys});
 localStorage.setItem("examsV1",JSON.stringify(exams));
 alert("Examen guardado correctamente.");
 refreshExams();
}
function refreshExams(){
 const s=document.getElementById("examSelect");
 s.innerHTML=exams.length?exams.map(e=>`<option value="${e.id}">${e.name}${e.group?" · "+e.group:""}</option>`).join(""):`<option value="">No hay exámenes</option>`;
 loadReview();
}
function getExam(){return exams.find(e=>String(e.id)===document.getElementById("examSelect").value)}
function loadReview(){
 const e=getExam(), a=document.getElementById("reviewArea");document.getElementById("gradeArea").innerHTML="";
 if(!e){a.innerHTML="<p>No hay un examen guardado.</p>";return}
 let h="";
 e.blocks.forEach(b=>{
  h+=`<div class="keyblock"><h3>${b}</h3><div class="answers">`;
  for(let i=1;i<=e.n;i++)h+=`<div class="q"><b>${i}</b><select class="ans" data-block="${b}" data-q="${i}"><option value="">—</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>`;
  h+="</div></div>";
 });
 a.innerHTML=h;
}
function grade(){
 const e=getExam(), student=document.getElementById("studentName").value.trim();
 if(!e)return alert("Selecciona un examen."); if(!student)return alert("Escribe el nombre del alumno.");
 let correct=0,total=e.n*e.blocks.length,detail=[];
 e.blocks.forEach(b=>{
  for(let i=1;i<=e.n;i++){
   const ans=document.querySelector(`.ans[data-block="${CSS.escape(b)}"][data-q="${i}"]`).value;
   const key=e.keys[b][i-1], ok=ans===key;if(ok)correct++;
   detail.push({block:b,q:i,ans,key,ok});
  }
 });
 const score=Math.round((correct/total*10)*10)/10;
 const r={date:new Date().toLocaleString("es-MX"),student,exam:e.name,group:e.group,correct,total,score,detail};
 results.push(r);localStorage.setItem("resultsV1",JSON.stringify(results));
 document.getElementById("gradeArea").innerHTML=`<div class="keyblock"><div class="result">${score.toFixed(1)}</div><div class="muted">${correct} de ${total} aciertos</div></div>`;
}
function renderResults(){
 const a=document.getElementById("resultsArea");
 if(!results.length){a.innerHTML="<p>Aún no hay resultados.</p>";return}
 a.innerHTML=`<table><thead><tr><th>Fecha</th><th>Alumno</th><th>Examen</th><th>Grupo</th><th>Aciertos</th><th>Calificación</th></tr></thead><tbody>${results.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.student}</td><td>${r.exam}</td><td>${r.group||""}</td><td>${r.correct}/${r.total}</td><td><b>${r.score.toFixed(1)}</b></td></tr>`).join("")}</tbody></table>`;
}
function exportCSV(){
 if(!results.length)return alert("No hay resultados.");
 const rows=[["Fecha","Alumno","Examen","Grupo","Aciertos","Total","Calificación"],...results.map(r=>[r.date,r.student,r.exam,r.group,r.correct,r.total,r.score])];
 const csv="\uFEFF"+rows.map(row=>row.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="resultados_examenes.csv";a.click();URL.revokeObjectURL(url);
}
refreshExams();
</script>
</body>
</html>
